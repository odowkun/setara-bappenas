name: Auto Deploy to Bappeda Halut On-Premise Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Windows Server (HP ProLiant)
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Output "=================================================="
          Write-Output "🚀 Memulai Otomasi Deployment BAPPEDA HALUT..."
          Write-Output "=================================================="

          $prodRoot = "C:\bappeda-halut"
          if (!(Test-Path $prodRoot)) {
            New-Item -ItemType Directory -Path $prodRoot -Force | Out-Null
          }

          # Helper Robocopy agar exit code 1-7 di-normalize menjadi 0 (mencegah false failure GitHub Actions)
          function Copy-Safe ($src, $dest, $excludeDirs = "", $excludeFiles = "") {
            $xd = if ($excludeDirs) { "/XD $excludeDirs" } else { "" }
            $xf = if ($excludeFiles) { "/XF $excludeFiles" } else { "" }
            cmd.exe /c "robocopy `"$src`" `"$dest`" /E $xd $xf & if %ERRORLEVEL% leq 7 exit 0"
          }

          # Setup PATH & Environment
          $env:PATH = "C:\php83;C:\Program Files\nodejs;C:\Users\Administrator\AppData\Roaming\npm;$env:PATH"
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"

          # 1. Salin file terbaru dari repo menggunakan robocopy safe (menjaga .env & storage)
          Write-Output "📂 Menyinkronkan file repository ke direktori produksi..."
          if (Test-Path "backend") {
            Copy-Safe "backend" "$prodRoot\backend" "storage" ".env .env.*"
          }
          if (Test-Path "frontend") {
            Copy-Safe "frontend" "$prodRoot\frontend" "node_modules .next" ".env .env.*"
          }
          if (Test-Path "scripts") {
            Copy-Safe "scripts" "$prodRoot\scripts"
          }

          # 2. Update Backend Laravel
          Write-Output "🐘 Memperbarui Backend Laravel..."
          Set-Location "$prodRoot\backend"
          & "C:\php83\php.exe" artisan migrate --force
          & "C:\php83\php.exe" artisan config:cache
          & "C:\php83\php.exe" artisan route:cache
          & "C:\php83\php.exe" artisan view:cache

          # 3. Update & Build Frontend Next.js
          Write-Output "⚛️ Memperbarui Frontend Next.js..."
          Set-Location "$prodRoot\frontend"
          cmd.exe /c "npm install --prefer-offline --no-audit"
          cmd.exe /c "npm run build"

          if (Test-Path "public") {
            Copy-Safe "public" ".next\standalone\public"
          }
          if (Test-Path ".next\static") {
            Copy-Safe ".next\static" ".next\standalone\.next\static"
          }

          # 4. Reload PM2 Zero-Downtime
          Write-Output "🔄 Mereload layanan PM2 (Zero-Downtime)..."
          cmd.exe /c "pm2 reload bappeda-api --update-env || pm2 restart bappeda-api"
          cmd.exe /c "pm2 reload bappeda-fe --update-env || pm2 restart bappeda-fe"
          cmd.exe /c "pm2 save"

          Write-Output "=================================================="
          Write-Output "🎉 DEPLOYMENT BERHASIL! Web Bappeda Halut Terupdate!"
          Write-Output "=================================================="
