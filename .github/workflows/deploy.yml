name: Auto Deploy to Bappeda Halut On-Premise Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Windows Server (HP ProLiant)
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Deployment Script
        run: powershell.exe -ExecutionPolicy Bypass -File .\scripts\deploy-prod.ps1
