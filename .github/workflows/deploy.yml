name: Auto Deploy to Bappeda Halut On-Premise Server

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy to Windows Server (HP ProLiant)
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Production
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          Write-Output "=================================================="
          Write-Output "🚀 Memulai Otomasi Deployment BAPPEDA HALUT..."
          Write-Output "=================================================="

          $prodRoot = "C:\bappeda-halut"
          if (!(Test-Path $prodRoot)) {
            New-Item -ItemType Directory -Path $prodRoot -Force | Out-Null
          }

          # Setup PATH & Environment
          $env:PATH = "C:\php83;C:\Program Files\nodejs;C:\Users\Administrator\AppData\Roaming\npm;$env:PATH"
          $env:PM2_HOME = "C:\Users\Administrator\.pm2"

          # 1. Salin file terbaru dari repo menggunakan robocopy (aman: menjaga .env & storage)
          Write-Output "📂 Menyinkronkan file repository ke direktori produksi..."
          if (Test-Path "backend") {
            robocopy "backend" "$prodRoot\backend" /E /XD storage /XF .env .env.* | Out-Null
            if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 }
          }
          if (Test-Path "frontend") {
            robocopy "frontend" "$prodRoot\frontend" /E /XD node_modules .next /XF .env .env.* | Out-Null
            if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 }
          }
          if (Test-Path "scripts") {
            robocopy "scripts" "$prodRoot\scripts" /E | Out-Null
            if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 }
          }

          # 2. Update Backend Laravel
          Write-Output "🐘 Memperbarui Backend Laravel..."
          Set-Location "$prodRoot\backend"
          & "C:\php83\php.exe" artisan migrate --force
          & "C:\php83\php.exe" artisan config:cache
          & "C:\php83\php.exe" artisan route:cache
          & "C:\php83\php.exe" artisan view:cache

          # 3. Update & Build Frontend Next.js
          Write-Output "⚛️ Memperbarui Frontend Next.js..."
          Set-Location "$prodRoot\frontend"
          npm install --prefer-offline --no-audit
          npm run build

          if (Test-Path "public") {
            robocopy "public" ".next\standalone\public" /E | Out-Null
            if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 }
          }
          if (Test-Path ".next\static") {
            robocopy ".next\static" ".next\standalone\.next\static" /E | Out-Null
            if ($LASTEXITCODE -le 7) { $global:LASTEXITCODE = 0 }
          }

          # 4. Reload PM2 Zero-Downtime
          Write-Output "🔄 Mereload layanan PM2 (Zero-Downtime)..."
          pm2 reload bappeda-api --update-env 2>$null
          if ($LASTEXITCODE -ne 0) { pm2 restart bappeda-api }

          pm2 reload bappeda-fe --update-env 2>$null
          if ($LASTEXITCODE -ne 0) { pm2 restart bappeda-fe }

          pm2 save

          Write-Output "=================================================="
          Write-Output "🎉 DEPLOYMENT BERHASIL! Web Bappeda Halut Terupdate!"
          Write-Output "=================================================="
